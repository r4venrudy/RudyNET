name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
# Replace stale PR checks; keep push, release, and manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install click requests dnspython Pillow pyflakes
      - run: python -m pyflakes modules utils tests rudynet.py
      - run: python -m unittest discover -s tests -v
